<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffc4d9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Happy Birthday 🎀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Caveat+Brush&family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@1,700;1,800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#e8386d; --pink-soft:#ff8fb1; --crimson:#9b1239; --bg1:#ffe3ee; --bg2:#ffc4d9;
  --paper:#fff6ea; --ink:#6b2a3a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:#ffc4d9;overflow:hidden;font-family:'Poppins',sans-serif;touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;
  background:linear-gradient(180deg,var(--bg1),var(--bg2));transition:background .6s}
#app.lav{background:linear-gradient(180deg,#ffe3ee 0%,#f6d5e8 55%,#e3d3f0 100%)}
#app.pale{background:linear-gradient(180deg,#fff0f5,#ffe0ec)}
#bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bgheart{position:absolute;bottom:-40px;color:rgba(255,120,160,.35);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh) rotate(25deg)}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
#stage{position:absolute;inset:0}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;animation:fadein .5s}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* top buttons */
.topbtn{position:absolute;top:calc(14px + env(safe-area-inset-top));z-index:60;border:0;background:#fff;color:var(--pink);
  box-shadow:0 3px 10px rgba(200,60,110,.18);font-family:'Poppins';font-weight:600;cursor:pointer}
#back{left:12px;height:38px;padding:0 14px;border-radius:20px;font-size:13px;display:none}
#mute{right:12px;width:40px;height:40px;border-radius:50%;font-size:17px;display:grid;place-items:center}
#counter{position:absolute;top:calc(22px + env(safe-area-inset-top));right:64px;z-index:60;font-size:11px;font-weight:700;
  color:var(--pink);background:rgba(255,255,255,.7);padding:4px 10px;border-radius:12px;display:none}

h1.script{font-family:'Caveat Brush',cursive;color:var(--crimson);text-align:center;font-weight:400;line-height:1.05}
.serif{font-family:'Playfair Display',serif;font-style:italic;font-weight:800;color:var(--pink)}
.btn{border:0;cursor:pointer;font-family:'Playfair Display',serif;font-weight:700;font-size:20px;border-radius:14px;padding:14px 30px;transition:transform .2s,opacity .3s}
.btn:active{transform:scale(.95)}
.btn.main{background:linear-gradient(180deg,#ef4a7d,#d62a60);color:#fff;box-shadow:0 8px 18px rgba(214,42,96,.35)}
.btn.ghost{background:#fff;color:var(--pink);border:2px solid #ffc1d5}
.btn.wide{width:calc(100% - 28px);border-radius:30px;font-family:'Poppins';font-size:17px;padding:16px}
.hidden{opacity:0;pointer-events:none}

/* intro */
.intro h1{font-size:clamp(32px,10.5vw,46px);margin-top:calc(64px + env(safe-area-inset-top))}
.intro svg.hero{width:auto;height:min(31dvh,260px);max-width:88%;margin-top:10px}
.intro p{font-family:'Playfair Display',serif;font-weight:700;color:var(--crimson);font-size:clamp(15px,4.4vw,18px);margin:8px 0 16px;text-align:center;padding:0 12px}
.intro .row{display:flex;gap:14px;position:relative;height:56px;width:240px;justify-content:center}

/* balloons */
.balloons h2{font-family:'Poppins';font-weight:700;color:var(--pink-soft);font-size:clamp(21px,6.8vw,28px);margin-top:calc(96px + env(safe-area-inset-top));text-align:center;
  filter:drop-shadow(0 1px 0 #fff)}
.word{position:absolute;font-family:'Caveat Brush';font-size:34px;color:#d6245f;opacity:0;transform:scale(.4);transition:all .5s cubic-bezier(.2,1.6,.4,1)}
.word.on{opacity:1;transform:scale(1)}
.balloon{position:absolute;width:clamp(70px,24vw,100px);cursor:pointer;animation:bob 3s ease-in-out infinite;transition:opacity .15s}
.balloon svg{width:100%;overflow:visible}
@keyframes bob{50%{transform:translateY(-14px) rotate(3deg)}}
.balloon.pop{animation:none;transform:scale(1.5);opacity:0}
.joined{position:absolute;left:0;right:0;top:40%;padding:0 22px;text-align:center;font-family:'Caveat Brush';font-size:clamp(38px,12.5vw,56px);line-height:1.1;color:#d6245f;opacity:0;transform:scale(.7);transition:opacity .6s,transform .7s cubic-bezier(.2,1.5,.4,1)}
.joined.on{opacity:1;transform:scale(1)}

/* candle */
.candle .card{margin-top:78px;width:calc(100% - 28px);height:calc(100% - 100px - env(safe-area-inset-bottom));border-radius:28px;
  background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.7);display:flex;flex-direction:column;align-items:center;padding:30px 16px 18px}
.candle h2{font-family:'Playfair Display',serif;font-weight:800;color:var(--crimson);font-size:27px;text-align:center;line-height:1.3}
.candle .cake{flex:1;display:grid;place-items:center;width:100%}
.candle .cake svg{width:70%;max-width:280px;overflow:visible}
.flame{transform-origin:50% 100%;animation:flick .18s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1) rotate(-2deg)}to{transform:scale(.92,1.1) rotate(2deg)}}
.smoke{opacity:0}

/* bouquet */
.bouquet h2{font-family:'Dancing Script',cursive;font-weight:700;font-size:clamp(28px,9vw,36px);color:var(--crimson);margin-top:calc(76px + env(safe-area-inset-top));white-space:nowrap}
.bouquet .bq{width:88%;max-width:360px;margin-top:6px;animation:grow 1.4s cubic-bezier(.2,1.2,.4,1);filter:drop-shadow(0 14px 18px rgba(120,10,40,.22));position:relative;z-index:2}
.bouquet .bq svg,.bouquet img.bq{width:100%;height:auto;display:block}
@keyframes grow{from{transform:scale(.2) translateY(80px);opacity:0}}
.tree{position:absolute;bottom:0;width:46%;max-width:220px}
.tree.l{left:-2%}.tree.r{right:-2%}
.petal{position:absolute;top:-20px;width:14px;height:18px;border-radius:50% 0 50% 50%;background:#c4172f;animation:fall linear infinite;opacity:.85}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.cta{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom));left:14px;right:14px;z-index:5}

/* photos */
.photos h2{font-family:'Playfair Display',serif;font-style:italic;font-weight:800;color:var(--pink);font-size:clamp(24px,7.6vw,30px);margin-top:calc(76px + env(safe-area-inset-top))}
.photos small{font-family:'Playfair Display',serif;font-style:italic;color:var(--pink-soft);font-size:14px;margin-top:2px}
.stack{position:relative;width:80%;max-width:340px;flex:1;margin-top:22px;margin-bottom:calc(92px + env(safe-area-inset-bottom))}
.pcard{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;border-radius:20px;padding:12px 12px 0;box-shadow:0 12px 28px rgba(190,60,110,.25);
  touch-action:none;user-select:none;cursor:grab;transition:transform .35s ease,opacity .35s}
.pcard.drag{transition:none;cursor:grabbing}
.pcard img{flex:1;min-height:0;width:100%;object-fit:cover;object-position:center;border-radius:12px;display:block;pointer-events:none;background:#ffe3ee}
.pcard .cap{flex:none;font-family:'Playfair Display',serif;font-style:italic;font-weight:800;color:var(--pink);font-size:clamp(21px,6.6vw,26px);text-align:center;line-height:62px}
.pick{position:absolute;left:50%;top:66%;transform:translate(-50%,-50%);background:rgba(255,255,255,.92);color:var(--pink);font-weight:600;font-size:13px;padding:8px 14px;border-radius:18px;pointer-events:none;box-shadow:0 4px 12px rgba(200,60,110,.25)}

/* letter */
.letter h2{font-family:'Playfair Display',serif;font-style:italic;font-weight:800;color:var(--crimson);font-size:clamp(20px,6vw,24px);margin-top:calc(76px + env(safe-area-inset-top))}
.paper{position:relative;width:calc(100% - 28px);flex:1;margin:18px 0 calc(96px + env(safe-area-inset-bottom));border-radius:14px;
  background:linear-gradient(180deg,#fffdf8,#fff3e3);box-shadow:0 14px 30px rgba(120,40,70,.22),0 0 0 1px #f0dcc6}
.paper::before{content:"";position:absolute;inset:8px;border:1px solid #ecd3b9;border-radius:9px;pointer-events:none;z-index:2}
.paper .inner{position:absolute;inset:0;border-radius:14px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:26px 24px 80px;scrollbar-width:none}
.paper .inner::-webkit-scrollbar{display:none}
.paper::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;border-radius:0 0 14px 14px;background:linear-gradient(0deg,#fff3e3 20%,rgba(255,243,227,0));pointer-events:none;z-index:2}
.paper p{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15.5px;line-height:1.75;color:#5a2b3c;margin-bottom:16px;white-space:pre-wrap;font-weight:500}
.paper p.greet{font-weight:700;color:var(--crimson);font-size:17px}
.paper p.last::after{content:"";display:inline-block;width:2px;height:1.05em;background:var(--pink);margin-left:2px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.seal{position:absolute;top:-10px;right:-6px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f2578a,#c9235c);
  color:#fff;display:grid;place-items:center;z-index:3;box-shadow:0 4px 10px rgba(180,30,80,.4);font-size:18px}
.bunnies{position:absolute;right:12px;bottom:12px;width:64px;opacity:.95;z-index:3}
.skip{position:absolute;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom));text-align:center;font-size:12px;color:var(--pink);opacity:.7;z-index:4;pointer-events:none}

/* gift */
.gift h2{font-family:'Dancing Script',cursive;font-weight:600;font-size:clamp(34px,11vw,44px);color:var(--pink-soft);margin-top:32vh}
.gift small{font-family:'Dancing Script';font-size:17px;color:var(--pink);margin-top:2px}
.giftbox{width:96px;margin-top:22px;cursor:pointer;animation:bob 2.2s ease-in-out infinite}
.giftbox.open{animation:none;transform:scale(1.8);opacity:0;transition:all .6s}

/* final */
.final .fcard{width:64%;max-width:270px;aspect-ratio:1;background:#fff;border-radius:22px;margin-top:calc(80px + env(safe-area-inset-top));display:grid;place-items:center;
  box-shadow:0 12px 30px rgba(190,60,110,.25);position:relative}
.final .fcard svg{width:88%}
.final .fcard .seal{width:34px;height:34px;font-size:14px;top:-6px;right:-6px}
.final h3{font-family:'Dancing Script',cursive;font-size:clamp(30px,9.4vw,38px);text-align:center;color:var(--pink);margin-top:20px}
.final p{font-family:'Playfair Display',serif;font-style:italic;color:#7a3447;font-size:14px;margin:6px 24px 16px;text-align:center}
.final .replay{background:#fff;border:0;border-radius:22px;padding:10px 26px;color:var(--pink);font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 4px 10px rgba(200,60,110,.18)}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(255,255,255,.85);color:var(--crimson);
  font-family:'Dancing Script';font-size:28px;padding:6px 20px;border-radius:20px;z-index:20;animation:fadein .5s}
@media (prefers-reduced-motion:reduce){.bgheart,.balloon,.flame,.giftbox{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="bg"></div>
  <button id="back" class="topbtn">← Back</button>
  <div id="counter">0/4 POPPED</div>
  <button id="mute" class="topbtn" aria-label="Toggle music">🔇</button>
  <div id="stage"></div>
  <canvas id="fx"></canvas>
</div>

<script>
/* =====================================================
   EDIT THIS SECTION — everything personal lives here
   You can also open the page as  birthday.html?to=Anjali
   ===================================================== */
const CONFIG = {
  name: "Vaibhavi",

  // Balloon words (4 balloons -> 4 words)
  balloonWords: ["You", "are", "so", "special"],

  // Photos: put your images next to this file (photo1.jpg ...) and list them here.
  // Leave src empty to get a placeholder.
  photos: [
    { src: "photo1.jpg", caption: "Celebrating you 🎉" },
    { src: "photo2.jpg", caption: "Celebrating you 🎉" },
    { src: "photo3.jpg", caption: "Celebrating you 🎉" },
    { src: "photo4.jpg", caption: "Celebrating you 🎉" },
    { src: "photo5.jpg", caption: "Celebrating you 🎉" }
  ],

  // Letter paragraphs (typed out one by one)
  letter: [
    "Dear {name},",
    "Happy Birthday to someone truly special! 🎀",
    "I was thinking back on all the moments we've shared, and I realized how rare and special a friendship like ours really is. 💗",
    "You are such a sweet soul, kind-hearted, and I'm so grateful to have you in my life. ❤️",
    "You bring so much warmth and sweetness into my world, and every moment with you is precious. ✨",
    "As you step into this new year of your life, I wish you moments that take your breath away, achievements that make you proud of your journey, and kind of deep, peaceful happiness that stays. 🥰",
    "May this year bring you countless beautiful moments and wonderful memories. 🎉",
    "You deserve every bit of love, joy, and success in the world."
  ],

  // Optional: your own music file (mp3). Leave "" to use the built-in Happy Birthday tune.
  music: "",
  // Optional: your own bouquet image. Leave "" to use the drawn roses.
  bouquetImage: ""
};
const NAME = new URLSearchParams(location.search).get("to") || CONFIG.name;

/* ============== helpers ============== */
const $ = (s, r = document) => r.querySelector(s);
const app = $("#app"), stage = $("#stage"), backBtn = $("#back"), muteBtn = $("#mute"), counter = $("#counter");
const h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
const rand = (a, b) => a + Math.random() * (b - a);
const timers = []; const later = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };
let cleanups = [];

/* floating hearts background */
(function(){
  const bg = $("#bg");
  for (let i = 0; i < 16; i++) {
    const s = document.createElement("span");
    s.className = "bgheart"; s.textContent = "❤";
    s.style.left = rand(0, 100) + "%"; s.style.fontSize = rand(16, 46) + "px";
    s.style.animationDuration = rand(12, 26) + "s"; s.style.animationDelay = -rand(0, 20) + "s";
    bg.appendChild(s);
  }
})();

/* ============== confetti / fx ============== */
const fx = $("#fx"), ctx = fx.getContext("2d"); let parts = [], raining = false;
function resize(){ fx.width = app.clientWidth * devicePixelRatio; fx.height = app.clientHeight * devicePixelRatio; }
addEventListener("resize", resize); resize();
const COLORS = ["#ff5c8a","#ffd166","#7bdff2","#b794f6","#ff9ab8","#ffe27a","#9be7a6"];
function burst(x, y, n = 60){
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: rand(-6, 6), vy: rand(-11, -2), g: .28, s: rand(5, 10),
    r: rand(0, 6), vr: rand(-.3, .3), c: COLORS[(Math.random() * COLORS.length) | 0], life: rand(70, 130), heart: Math.random() < .25 });
}
function rain(on){ raining = on; }
(function loop(){
  ctx.clearRect(0, 0, fx.width, fx.height);
  if (raining && parts.length < 140) parts.push({ x: rand(0, app.clientWidth), y: -10, vx: rand(-1, 1), vy: rand(1.5, 3.5), g: .01,
    s: rand(6, 11), r: 0, vr: rand(-.2, .2), c: COLORS[(Math.random() * COLORS.length) | 0], life: 400, heart: Math.random() < .2 });
  parts = parts.filter(p => p.life > 0 && p.y < app.clientHeight + 30);
  for (const p of parts){
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.r += p.vr; p.life--;
    ctx.save(); ctx.scale(devicePixelRatio, devicePixelRatio); ctx.translate(p.x, p.y); ctx.rotate(p.r);
    ctx.globalAlpha = Math.min(1, p.life / 40); ctx.fillStyle = p.c;
    if (p.heart) { ctx.font = p.s * 2 + "px serif"; ctx.fillText("❤", -p.s, p.s); }
    else ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
    ctx.restore();
  }
  requestAnimationFrame(loop);
})();

/* ============== audio ============== */
let AC, muted = true, musicEl = null, synthTimer = null, master;
function ensureAudio(){ if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination); } if (AC.state === "suspended") AC.resume(); }
// Happy Birthday (public-domain tune): [semitone offset from C4, beats]
const TUNE = [[0,.75],[0,.25],[2,1],[0,1],[5,1],[4,2],[0,.75],[0,.25],[2,1],[0,1],[7,1],[5,2],
  [0,.75],[0,.25],[12,1],[9,1],[5,1],[4,1],[2,1],[10,.75],[10,.25],[9,1],[5,1],[7,1],[5,2]];
function playSynth(){
  ensureAudio(); let t = AC.currentTime + .1; const beat = .5;
  for (const [n, b] of TUNE){
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = "triangle"; o.frequency.value = 261.63 * Math.pow(2, n / 12);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.35, t + .03); g.gain.exponentialRampToValueAtTime(.001, t + b * beat * .95);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + b * beat); t += b * beat;
  }
  synthTimer = setTimeout(playSynth, (t - AC.currentTime + 1.2) * 1000);
}
function setMuted(m){
  muted = m; muteBtn.textContent = m ? "🔇" : "🔊"; ensureAudio();
  master.gain.value = m ? 0 : 1;
  if (musicEl) musicEl.muted = m;
}
function startMusic(){
  ensureAudio();
  if (CONFIG.music){ musicEl = musicEl || Object.assign(new Audio(CONFIG.music), { loop: true }); musicEl.play().catch(()=>{}); }
  else if (!synthTimer) playSynth();
  setMuted(false);
}
muteBtn.onclick = () => { if (!AC) startMusic(); else setMuted(!muted); };
function pop(){ ensureAudio(); if (muted) return;
  const len = AC.sampleRate * .12, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const s = AC.createBufferSource(), g = AC.createGain(); g.gain.value = .8; s.buffer = buf; s.connect(g); g.connect(AC.destination); s.start(); }
function chime(){ ensureAudio(); if (muted) return;
  [880, 1175, 1568].forEach((f, i) => { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = f; o.type = "sine";
    const t = AC.currentTime + i * .09; g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.001, t + .6);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + .6); }); }

/* ============== SVG art (all original) ============== */
const heartPath = "M12 21s-7-4.6-9.3-9.2C1 8.3 3 5 6.2 5c2 0 3.4 1.1 4.2 2.4h1.2C12.4 6.1 13.8 5 15.8 5 19 5 21 8.3 19.3 11.8 17 16.4 12 21 12 21z";
const bearArt = `<svg class="hero" viewBox="0 0 360 250">
  <path d="M10 40 Q180 80 350 40" fill="none" stroke="#c2185b" stroke-width="2"/>
  ${["#ff6f91","#ffd166","#7bdff2","#9be7a6","#ff6f91","#ffd166","#7bdff2","#9be7a6"].map((c,i)=>`<path d="M${30+i*40} ${52+Math.sin(i/7*3.14)*14} l16 0 l-8 16z" fill="${c}"/>`).join("")}
  <g><circle cx="105" cy="130" r="52" fill="#c89b7b"/><circle cx="68" cy="92" r="17" fill="#c89b7b"/><circle cx="142" cy="92" r="17" fill="#c89b7b"/>
     <ellipse cx="105" cy="145" rx="22" ry="17" fill="#e8c9ac"/><circle cx="88" cy="125" r="5" fill="#3a2a2a"/><circle cx="122" cy="125" r="5" fill="#3a2a2a"/>
     <ellipse cx="105" cy="138" rx="6" ry="4" fill="#3a2a2a"/><circle cx="76" cy="140" r="8" fill="#ffa7a7" opacity=".6"/>
     <path d="M82 80 L105 42 L128 80z" fill="#ff6f91"/><circle cx="105" cy="42" r="7" fill="#fff"/></g>
  <g><circle cx="255" cy="130" r="52" fill="#fff"/><circle cx="220" cy="94" r="17" fill="#fff"/><circle cx="290" cy="94" r="17" fill="#fff"/>
     <circle cx="238" cy="125" r="5" fill="#3a2a2a"/><circle cx="272" cy="125" r="5" fill="#3a2a2a"/><ellipse cx="255" cy="138" rx="6" ry="4" fill="#3a2a2a"/>
     <circle cx="224" cy="141" r="8" fill="#ffb3c1"/><circle cx="286" cy="141" r="8" fill="#ffb3c1"/>
     <path d="M232 82 L255 44 L278 82z" fill="#7bdff2"/><circle cx="255" cy="44" r="7" fill="#fff"/></g>
  <ellipse cx="180" cy="218" rx="78" ry="14" fill="#fff" stroke="#eecbd8"/>

/* ---- 3. candle ---- */
function sCandle(){
  app.classList.add("lav");
  const s = scene("candle", `<div class="card"><h2>Blow the candle,<br>${NAME} 🎀</h2><div class="cake">${cakeArt}</div>
    <button class="btn ghost wide" id="blow">💨 Blow into the mic</button></div>`);
  const btn = $("#blow", s); let done = false, stream, raf;
  const finish = () => { if (done) return; done = true; cancelAnimationFrame(raf); stream && stream.getTracks().forEach(t => t.stop());
    $("#flameG", s).style.display = "none"; const sm = $(".smoke", s); sm.style.transition = "all 1.6s"; sm.style.opacity = .8; later(() => { sm.style.opacity = 0; sm.style.transform = "translateY(-30px)"; }, 100);
    chime(); burst(app.clientWidth / 2, app.clientHeight * .5, 120); btn.textContent = "Make a wish ✨";
    later(() => { app.querySelector(".card")?.insertAdjacentHTML("beforeend", ""); }, 0); later(next, 3200); };
  cleanups.push(() => { stream && stream.getTracks().forEach(t => t.stop()); cancelAnimationFrame(raf); });
  btn.onclick = async () => {
    if (done) return;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const ac = new (window.AudioContext || window.webkitAudioContext)(), src = ac.createMediaStreamSource(stream), an = ac.createAnalyser();
      an.fftSize = 512; src.connect(an); const data = new Uint8Array(an.fftSize); let hits = 0; btn.textContent = "Listening… blow now 💨";
      (function tick(){ an.getByteTimeDomainData(data); let sum = 0; for (const v of data) sum += ((v - 128) / 128) ** 2;
        hits = Math.sqrt(sum / data.length) > .14 ? hits + 1 : Math.max(0, hits - 1);
        if (hits > 10) return finish(); raf = requestAnimationFrame(tick); })();
    } catch (e) { btn.textContent = "Mic blocked — tap the candle 🕯️"; }  // fallback
  };
  $(".cake", s).onclick = finish; // tap-to-blow fallback (also handy on desktop / http)
}

function placeholder(i){
  const c = [["#ffd1e0","#ff9fbd"],["#e8d4ff","#b99cff"],["#cfeeff","#8fcbff"]][i % 3];
  return "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='400' height='500'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${c[0]}'/><stop offset='1' stop-color='${c[1]}'/></linearGradient></defs><rect width='400' height='500' fill='url(#g)'/><text x='200' y='260' font-size='64' text-anchor='middle'>📸</text></svg>`);
}
function sPhotos(){
  const s = scene("photos", `<h2>Some Sweet Moments</h2><small>(Swipe the cards)</small><div class="stack" id="stack"></div>
    <div class="cta"><button class="btn main wide hidden" id="c">Continue</button></div>`);
  const stack = $("#stack", s), list = CONFIG.photos; let seen = 1;
  const picker = h(`<input type="file" accept="image/*" hidden>`); s.appendChild(picker); let pickFor = null;
  picker.onchange = () => { const f = picker.files[0]; if (!f || !pickFor) return; const img = $("img", pickFor);
    img.onerror = null; img.src = URL.createObjectURL(f); delete pickFor.dataset.ph; $(".pick", pickFor)?.remove(); picker.value = ""; };
  const drop = (c) => { const k = cards.indexOf(c); if (k < 0) return; cards.splice(k, 1); c.remove(); layout(); check(); };
  const cards = list.map((p, i) => {
    const c = h(`<div class="pcard"><img alt=""><div class="cap"></div></div>`), img = $("img", c);
    $(".cap", c).textContent = p.caption;
    const ph = () => { img.onerror = null; img.src = placeholder(i); c.dataset.ph = 1; c.insertAdjacentHTML("beforeend", `<div class="pick">Tap to add photo</div>`); };
    const exts = [".jpeg", ".png", ".webp", ".JPG", ".jpg"]; let tryN = 0, base = (p.src || "").replace(/\.(jpe?g|png|webp)$/i, "");
    img.onerror = () => { if (base && tryN < exts.length) img.src = base + exts[tryN++]; else if (base && /^https?:/.test(location.protocol)) drop(c); else ph(); };
    if (p.src) img.src = p.src; else ph();
    return c; });
  const layout = () => cards.forEach((c, i) => { c.style.zIndex = cards.length - i; c.style.opacity = i > 2 ? 0 : 1;
    c.style.transform = i === 0 ? "none" : `translate(${i * 8}px,${i * 6}px) rotate(${i % 2 ? 4 : -4}deg) scale(${1 - i * .03})`; });
  cards.forEach(c => stack.appendChild(c)); layout();
  const check = () => { if (seen >= cards.length) $("#c", s).classList.remove("hidden"); }; check();
  let sx = 0, dx = 0, top = null;
  stack.addEventListener("pointerdown", e => { top = cards[0]; sx = e.clientX; dx = 0; top.classList.add("drag"); top.setPointerCapture(e.pointerId); });
  stack.addEventListener("pointermove", e => { if (!top) return; dx = e.clientX - sx; top.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`; });
  const end = () => { if (!top) return; top.classList.remove("drag");
    if (Math.abs(dx) > 60){ const dir = dx > 0 ? 1 : -1, t = top; t.style.transform = `translateX(${dir * 560}px) rotate(${dir * 30}deg)`; t.style.opacity = 0;
      later(() => { cards.push(cards.shift()); t.style.transition = "none"; layout(); void t.offsetWidth; t.style.transition = ""; seen = Math.min(cards.length, seen + 1); check(); }, 300); }
    else { if (Math.abs(dx) < 6 && top.dataset.ph){ pickFor = top; picker.click(); } layout(); }
    top = null; };
  stack.addEventListener("pointerup", end); stack.addEventListener("pointercancel", end);
  $("#c", s).onclick = next;
}

function sFinal(){
  app.classList.add("pale");
  const s = scene("final", `<div class="fcard"><div class="seal">♥</div>${bunnyBear()}</div><h3>Lots of love for you ❤️</h3>
    <p>Once again, Happy Birthday ${NAME} 🎀!</p><button class="replay" id="r">↻ Replay</button>`);
  rain(true); chime(); burst(app.clientWidth / 2, app.clientHeight * .3, 120);
  $("#r", s).onclick = () => { hist.length = 0; go(0, false); };
}

go(0, false);
</script>
